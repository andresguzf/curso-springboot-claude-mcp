spring.application.name=5-mcp

# Variables de entorno locales desde .env (no se sube a git; plantilla en .env.example).
spring.config.import=optional:file:.env[.properties]

# Aplicación solo MCP (sin API REST): el servidor web existe únicamente como
# transporte Streamable HTTP del endpoint /mcp.
# Solo escucha en localhost: el servidor MCP no tiene autenticación y puede modificar datos.
server.address=127.0.0.1
server.port=${SERVER_PORT:8090}

# --- PostgreSQL (Supabase, Session pooler) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mcp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# El pooler de Supabase limita las conexiones: un pool chico basta.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# --- JPA / Hibernate ---
# validate: las tablas ya existen en Supabase (creadas con migraciones);
# Hibernate solo comprueba que las entidades coincidan, nunca altera el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Servidor MCP (Spring AI, Streamable HTTP en /mcp) ---
spring.ai.mcp.server.name=facturacion
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Sistema de facturación: administra clientes, facturas y sus líneas. \
Los montos (subtotal, IVA y total) los calcula el sistema a partir de las líneas. \
Solo las facturas PENDING se pueden editar; PAID y CANCELLED son estados finales. \
Para encontrar el id de un cliente por su nombre usa list_customers con search. \
Pide confirmación al usuario antes de borrar clientes o facturas.

# --- Facturación ---
# IVA de Chile (19 %).
billing.tax-rate=0.19
